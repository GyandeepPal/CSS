<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbaar</title>
</head>
<style>
    * {
        margin: 0px;
        padding: 0px;



    }

    .nav {
        background-color: rgb(12, 43, 244);
        justify-content:flex-end;
        padding: 20px;
        display: flex;
        text-decoration: none;
    }

  

    ul li a {
        color: rgb(234, 237, 240);
        margin: 9px;
        text-decoration: none;

    }


    ul li {
        display: inline;
        padding: 71px;
        color: rgb(242, 236, 236);
        font-size: 22px;

    }
   

    

</style>

<body>
    <main>
        <div class="nav">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">contact Us</a></li>
                <li class="right"><a href="/">GyandeepPal</a></li>
            </ul>
        </div>  
        
    </main>

</body>

</html>
