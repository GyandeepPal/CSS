    <title>Grid</title>

<style>
    .cantainer {
        display: grid;
        border: 2px solid rgb(4, 4, 4);
        /* grid-template-columns: 300px 300px; */
        /* grid-template-rows: 100px 100px 120px; */
        display: grid;
        margin: 20%;
        justify-content: center;
        /* grid-template-areas: "nav nav nav"
            grid-template-areas:                "side article article"
               grid-template-areas:             "f f f" */
        grid-template-columns: 1fr 2fr 1fr;
        gap: 33px;
        column-gap: 12px;
        row-gap: 12px;
        justify-items: end;
        justify-content: start;
        align-items: start;
    }

    .item {
        background-color: rgb(192, 91, 14);
        height: 100px;
        width: 60px;
        margin: 9px;

        border: 2px solid red;
        padding: 2px;
    }
